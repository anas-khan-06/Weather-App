<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="name">
          <h2>🌤️Weather App</h2>
        </div>
        <div class="items">
            <input type="text" placeholder="Enter The City" class="input">
            <button class="btn"><img class="btnp" src="search.png" alt=""></button>
        </div>
    </nav>
    <div class="container">
        <div class="picture">
            <h1>🌤️</h1>
<div class="temp ">0 <sup>C</sup> <br> <p style="font-size: small;">Enter Location to Get the weaather</p> </div>
        </div >
        <div class="items">
            
        <div class="feels box"><p>0 <sup>c</sup></p></div>
        <div class="min box">0 <br> Min temp</div>
        <div class="max box"> 0 <br> Max Temo</div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
